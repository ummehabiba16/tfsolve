# Runs on every push and pull request: proves tfsolve installs and works on Windows, macOS and Linux.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: tfsolve lint
      - run: python -m pytest -q
      - name: Build a .tex without LaTeX (what a fresh install can always do)
        run: tfsolve -c CSE313 -f current --tex -o out/check.pdf

  pdf:
    # One full PDF build with a real LaTeX install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-pictures texlive-fonts-recommended fonts-lmodern
      - run: python -m pip install -e ".[scan]"
      - run: tfsolve doctor
      - run: tfsolve check
      - uses: actions/upload-artifact@v4
        with:
          name: check-pdf
          path: out/check/*.pdf
