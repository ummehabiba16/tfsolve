schema: 1
code: CSE317
title: Artificial Intelligence
dept: CSE
level_term: L3T1        # printed L-3/T-I from the 2023-24 session; L3T2 before that
credit: 3.0
previous_codes: [CSE401]   # L-4/T-1 course code up to the 2017-18 session

# Topic tree. Question parts are tagged with these ids (first tag = where the part is filed).
# Asking for a parent (-t search) also returns its children. Aliases are alternative
# names for -t; they must be unique within the course.
topics:
  # ---- Section A in recent papers (MMI): Russell & Norvig, AIMA chapters 1-6
  - id: foundations
    name: Foundations and philosophy of AI
    aliases: [introduction, intro, philosophy]
    children:
      - id: ai-approaches
        name: Definitions of AI and the four approaches
        aliases: [four-approaches, definitions-of-ai, laws-of-thought, can-machines-think]
      - id: turing-test
        name: The Turing test
        aliases: [turing, total-turing-test]
      - id: rationality-evolution
        name: Rationality, intelligence and evolution
        aliases: [rationality, intelligence, evolution-rationality]

  - id: agents
    name: Intelligent agents
    aliases: [agent, intelligent-agents]
    children:
      - id: peas-environments
        name: PEAS descriptions and task-environment properties
        aliases: [peas, task-environment, environment-types]
      - id: agent-types
        name: "Agent types: simple reflex, model-based, goal-based, utility-based, learning"
        aliases: [reflex-agent, model-based-agent, goal-based-agent, utility-based-agent, learning-agent, autonomy]
      - id: agent-programs
        name: Agent programs (pseudocode)
        aliases: [agent-program, problem-solving-agent]

  - id: search
    name: Problem formulation and uninformed search
    aliases: [uninformed-search, problem-solving]
    children:
      - id: problem-formulation
        name: Goal and problem formulation, state spaces, abstraction
        aliases: [formulation, state-space, goal-formulation, abstraction, contingency-problem, missionaries-cannibals]
      - id: uninformed-strategies
        name: "Uninformed strategies: BFS, DFS, UCS, depth-limited, IDS, bidirectional"
        aliases: [bfs, dfs, ucs, uniform-cost, ids, iterative-deepening, depth-limited, bidirectional]
      - id: search-comparison
        name: Completeness, optimality, time and space complexity of search strategies
        aliases: [search-criteria, completeness, optimality]

  - id: informed
    name: Informed (heuristic) search
    aliases: [informed-search, heuristic-search]
    children:
      - id: astar
        name: A* search and its optimality (admissible / consistent heuristics)
        aliases: [a-star, admissible, consistent, monotonic]
      - id: greedy-best-first
        name: Greedy best-first search
        aliases: [best-first, greedy-best]
      - id: heuristics
        name: Designing heuristics (relaxed problems, learning from experience)
        aliases: [heuristic, relaxed-problem, heuristic-function]
      - id: memory-bounded
        name: Memory-bounded search (IDA*, RBFS)
        aliases: [ida-star, idastar, rbfs]

  - id: local-search
    name: Local search and optimization
    aliases: [local, optimization]
    children:
      - id: hill-climbing
        name: Hill climbing and the pitfalls of greedy search
        aliases: [hill-climbing-search, greedy-search, greedy-pitfalls, local-maxima, random-restart]
      - id: simulated-annealing
        name: Simulated annealing
        aliases: [annealing, sa, cooling-schedule]
      - id: genetic-algorithm
        name: Genetic and evolutionary algorithms (incl. TSP)
        aliases: [ga, genetic, evolutionary, evolutionary-algorithm, tsp]
      - id: local-beam
        name: Local beam search
        aliases: [beam-search, beam]

  - id: csp
    name: Constraint satisfaction problems
    aliases: [constraint-satisfaction, csps]
    children:
      - id: csp-formulation
        name: CSP formulation and components
        aliases: [csp-definition, csp-components]
      - id: csp-heuristics
        name: Variable and value ordering (MRV, degree, LCV)
        aliases: [mrv, lcv, most-constrained, least-constraining]
      - id: arc-consistency
        name: Arc consistency, AC-3 and k-consistency
        aliases: [ac-3, ac3, k-consistency, constraint-propagation]
      - id: csp-backtracking
        name: Backtracking search and forward checking
        aliases: [backtracking, forward-checking, chronological-backtracking]
      - id: min-conflicts
        name: Local search for CSPs (min-conflicts)
        aliases: [min-conflict]

  - id: games
    name: Adversarial search and games
    aliases: [adversarial, adversarial-search, game-playing]
    children:
      - id: minimax
        name: Minimax and game formulation
        aliases: [mini-max, game-tree, game-formulation]
      - id: alpha-beta
        name: Alpha-beta pruning
        aliases: [alphabeta, pruning]
      - id: nonzero-sum
        name: Non-zero-sum and multi-player games
        aliases: [non-zero-sum, nonzero-sum-games]

  # ---- Section B in recent papers (MNM_Slide/): uncertainty, Bayes nets, HMMs, MDPs, learning.
  #      Logic and planning come from older papers (setters not identified yet).
  - id: logic-planning
    name: Logic, knowledge representation and planning
    aliases: [logic, knowledge-representation, kr]
    children:
      - id: propositional-logic
        name: "Propositional logic: knowledge bases, entailment, model checking, DPLL, resolution"
        aliases: [propositional, prop-logic, dpll, model-checking, wumpus, wumpus-world, knowledge-base]
      - id: first-order-logic
        name: "First-order logic: representation, CNF, unification, resolution"
        aliases: [fol, predicate-logic, resolution, unification, cnf, forward-chaining, backward-chaining]
      - id: planning
        name: "Planning: STRIPS actions, goal stack, regression, planning graphs, scheduling, frame problem"
        aliases: [goal-stack, goal-stack-planning, strips, graphplan, planning-graph, scheduling, job-shop-scheduling, regression-planning, frame-problem, situational-calculus, situation-calculus]

  - id: uncertainty
    name: Probability, Bayesian networks, HMMs and MDPs
    aliases: [probabilistic-reasoning]
    children:
      - id: probability
        name: "Probability basics: conditional probability, Bayes' rule, independence, naive Bayes"
        aliases: [bayes-rule, bayes-theorem, conditional-probability, joint-distribution, naive-bayes, de-finetti]
      - id: bn-representation
        name: "Bayesian networks: structure, CPTs and the full joint distribution"
        aliases: [bayesian-network, bayes-net, bn, cpt, hybrid-bayesian-network]
      - id: bn-independence
        name: Conditional independence in Bayesian networks (d-separation, Markov blanket)
        aliases: [d-separation, dseparation, markov-blanket, conditional-independence]
      - id: bn-exact-inference
        name: "Exact inference: enumeration and variable elimination"
        aliases: [exact-inference, variable-elimination, enumeration, inference-by-enumeration, polytree]
      - id: bn-sampling
        name: "Approximate inference: prior, rejection, likelihood-weighting and Gibbs sampling"
        aliases: [sampling, approximate-inference, rejection-sampling, likelihood-weighting, gibbs-sampling, prior-sampling]
      - id: markov-hmm
        name: Markov chains and hidden Markov models (forward algorithm, filtering, particle filtering)
        aliases: [hmm, markov-chain, markov-model, hidden-markov-model, forward-algorithm, particle-filtering, stationary-distribution]
      - id: mdp
        name: "Markov decision processes: Bellman equation, value and policy iteration"
        aliases: [markov-decision-process, value-iteration, policy-iteration, bellman, grid-world]

  - id: learning
    name: Machine learning and NLP
    aliases: [machine-learning, ml]
    children:
      - id: decision-tree
        name: Decision trees (entropy, information gain, expressiveness)
        aliases: [decision-trees, dt, information-gain, entropy, id3]
      - id: learning-theory
        name: "Learning theory: ERM, PAC learning, Occam's razor, agnostic learning, VC dimension"
        aliases: [pac, pac-learning, erm, vc-dimension, vc, occam, agnostic-learning, sample-complexity]
      - id: learning-concepts
        name: "Learning basics: types of learning, overfitting, evaluation, regression, nearest neighbour, ensembles, clustering"
        aliases: [supervised-learning, overfitting, ensemble, ensemble-learning, clustering, k-means, nearest-neighbor, knn, precision-recall, linear-regression, gradient-descent]
      - id: neural-networks
        name: Perceptrons and neural networks
        aliases: [perceptron, neural-network, nn]
      - id: reinforcement-learning
        name: Reinforcement learning (Q-learning)
        aliases: [rl, q-learning]
      - id: nlp
        name: "Natural language processing: grammars, parsing, word embeddings"
        aliases: [natural-language, cfg, parsing, word-embedding, skip-gram, word2vec]

  - id: robotics
    name: Robotics and perception
    aliases: [robot, degrees-of-freedom, perception]
