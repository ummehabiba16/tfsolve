      - id: inversion-derangements
        name: Inversion formula, derangements, hat-check and rook placements
        aliases: [inversion-formula, derangements, hatcheck, rook-polynomial, rooks]

  - id: special-numbers
    name: Special numbers
    aliases: [special-sequences]
    children:
      - id: stirling-numbers
        name: Stirling numbers of the first and second kind
        aliases: [stirling, stirling-first-kind, stirling-second-kind]
      - id: eulerian-numbers
        name: Eulerian numbers and Euler numbers
        aliases: [eulerian, euler-numbers]
      - id: fibonacci
        name: Fibonacci numbers (fast computation, identities)
        aliases: [fibonacci-numbers, matrix-power]
      - id: catalan-trees
        name: Catalan numbers and counting binary trees
        aliases: [catalan, binary-trees]

  - id: number-theory
