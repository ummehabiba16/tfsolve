      - id: josephus
        name: The Josephus problem and variants
        aliases: [josephus-problem]
      - id: recurrence-modeling
        name: Forming a recurrence for an algorithm or counting problem (quicksort, inversions)
        aliases: [quicksort, form-recurrence, recurrence-formulation]

  - id: recurrence-solving
    name: Solving recurrences (repertoire method, characteristic roots, substitution)
    aliases: [repertoire-method, linear-recurrence, characteristic-equation, solve-recurrence]

  - id: sums
    name: Sums and finite calculus
    aliases: [summation]
    children:
      - id: summation-methods
        name: Manipulating sums, perturbation method, double sums and closed forms
        aliases: [perturbation, double-sums, closed-form-sums, sum-manipulation]
      - id: summation-factor
        name: Summation factor for recurrences
        aliases: [summation-factors]
      - id: finite-calculus
        name: Falling powers, difference operator and summation by parts
        aliases: [summation-by-parts, falling-powers, difference-operator]
      - id: harmonic-numbers
        name: Harmonic numbers, maximum overhang and rubber-band problems
        aliases: [harmonic, overhang, maximum-overhang, ant-and-worm]

  - id: floor-ceiling
    name: Floors, ceilings and spectra
    aliases: [floors-and-ceilings, spectrum, beatty]

  - id: binomial-coefficients
