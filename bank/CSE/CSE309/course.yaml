# Topic tree. Question parts are tagged with these ids (first tag = where the part is filed).
# Asking for a parent (-t lexical) also returns its children. Aliases are alternative
# names for -t; they must be unique within the course.
# Textbook: Aho, Lam, Sethi, Ullman, Compilers: Principles, Techniques & Tools, 2e ("Dragon book").
topics:
