    children:
      - id: mp-vs-mcu
        name: Microprocessor vs microcontroller
        aliases: [microprocessor-vs-microcontroller]
      - id: von-neumann-harvard
        name: Von Neumann vs Harvard architecture
        aliases: [harvard, von-neumann]
      - id: risc-cisc
        name: RISC vs CISC
        aliases: [risc, cisc]
        slides: "6"

  - id: avr-memory
    name: ATmega32 memory and EEPROM
